AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Auth Backend

Parameters:
  FrontendUrl:
    Type: String
    Default: ""
    Description: "The frontend URL for CORS and redirects"
  BackendUrl:
    Type: String
    Default: ""
    Description: "The backend API URL"
  JwtSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "The secret used to sign JWTs"
  SmtpHost:
    Type: String
    Default: ""
    Description: "The SMTP server host"
  SmtpPort:
    Type: String
    Default: "587"
    Description: "The SMTP server port"
  SmtpUser:
    Type: String
    Default: ""
    NoEcho: true
    Description: "The SMTP username"
  SmtpPass:
    Type: String
    Default: ""
    NoEcho: true
    Description: "The SMTP password"
  MailFrom:
    Type: String
    Default: ""
    Description: "The email address to send emails from"
  GoogleClientId:
    Type: String
    Default: ""
    Description: "Google OAuth Client ID"
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Google OAuth Client Secret"
  GithubClientId:
    Type: String
    Default: "paste_your_github_client_id_here"
    Description: "GitHub OAuth Client ID"
  GithubClientSecret:
    Type: String
    Default: "paste_your_github_client_secret_here"
    NoEcho: true
    Description: "GitHub OAuth Client Secret"

Globals:
  Function:
    Timeout: 30
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        SESSIONS_TABLE: !Ref SessionsTable
        AUTH_SESSIONS_TABLE: !Ref AuthSessionsTable
        AUDIT_LOGS_TABLE: !Ref AuditLogsTable
        ANALYTICS_TABLE: !Ref AnalyticsTable
        BLOGS_TABLE: !Ref BlogsTable
        PROJECTS_TABLE: !Ref ProjectsTable
        FRONTEND_URL: !Ref FrontendUrl
        BACKEND_URL: !Ref BackendUrl
        JWT_SECRET: !Ref JwtSecret
        SMTP_HOST: !Ref SmtpHost
        SMTP_PORT: !Ref SmtpPort
        SMTP_USER: !Ref SmtpUser
        SMTP_PASS: !Ref SmtpPass
        SMTP_FROM: !Ref MailFrom
        GOOGLE_CLIENT_ID: !Ref GoogleClientId
        GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
        GITHUB_CLIENT_ID: !Ref GithubClientId
        GITHUB_CLIENT_SECRET: !Ref GithubClientSecret

Resources:
  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: auth-audit-logs
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: auth-analytics
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: auth-users
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: googleId
          AttributeType: S
        - AttributeName: githubId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GoogleIdIndex
          KeySchema:
            - AttributeName: googleId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GithubIdIndex
          KeySchema:
            - AttributeName: githubId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  AuthSessionsTable: 
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: auth-user-sessions
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: TokenIndex
          KeySchema:
            - AttributeName: token
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: express-sessions
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  BlogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: auth-blogs
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: authorId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: AuthorIdIndex
          KeySchema:
            - AttributeName: authorId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: auth-projects
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: authorId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: AuthorIdIndex
          KeySchema:
            - AttributeName: authorId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  AuthApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ProxyApiGreedy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  AuthBackendApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
