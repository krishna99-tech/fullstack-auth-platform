<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — Authlog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c12;
      --card-bg: rgba(24, 24, 32, 0.75);
      --card-border: rgba(126, 86, 219, 0.25);
      --card-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(126, 86, 219, 0.15);
      --glow: rgba(126, 86, 219, 0.18);
      --text: #f4f4f5;
      --muted: #71717a;
      --subtle: #3f3f46;
      --accent: #7e56db;
      --accent-light: #a78bfa;
      --red: #ef4444;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f0f8;
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(126, 86, 219, 0.2);
        --card-shadow: 0 32px 80px rgba(108, 72, 196, 0.12), 0 0 0 1px rgba(126, 86, 219, 0.12);
        --glow: rgba(126, 86, 219, 0.08);
        --text: #09090b;
        --muted: #71717a;
        --subtle: #d4d4d8;
        --accent: #6c48c4;
        --accent-light: #7c3aed;
      }
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(126, 86, 219, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ── Card ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--card-shadow);
      padding: 2.5rem 2rem;
      text-align: center;
      overflow: hidden;
    }

    /* Soft glow orb behind the card content */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, var(--glow), transparent 70%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* Subtle shimmer line at the top of the card */
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
      opacity: 0.6;
    }

    /* ── Icon ── */
    .icon-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(126, 86, 219, 0.15), rgba(99, 102, 241, 0.08));
      border: 1px solid rgba(126, 86, 219, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: var(--accent-light);
    }

    /* Ripple rings around the icon */
    .icon-wrap .ring {
      position: absolute;
      inset: -12px;
      border-radius: 28px;
      border: 1px solid rgba(126, 86, 219, 0.12);
      animation: ripple 3s ease-out infinite;
    }
    .icon-wrap .ring:nth-child(2) {
      inset: -22px;
      border-radius: 36px;
      animation-delay: 0.8s;
      border-color: rgba(126, 86, 219, 0.07);
    }

    @keyframes ripple {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.2); }
    }

    /* ── Status badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.08);
      font-size: 0.72rem;
      font-weight: 600;
      color: #f87171;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50%       { opacity: 0.7; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
    }

    /* ── Text ── */
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.2;
      margin-bottom: 0.65rem;
    }

    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--subtle), transparent);
      margin: 0 -2rem 1.75rem;
    }

    /* ── Button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1.75rem;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #fff;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 20px rgba(126, 86, 219, 0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(126, 86, 219, 0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(126, 86, 219, 0.3);
    }

    .btn svg {
      transition: transform 0.3s ease;
    }
    .btn:hover svg {
      transform: rotate(180deg);
    }

    /* ── Wordmark ── */
    .wordmark {
      margin-top: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
    }

    .wordmark-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Icon with ripple rings -->
    <div class="icon-wrap">
      <span class="ring"></span>
      <span class="ring"></span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 3l18 18M8.457 8.457A7.49 7.49 0 0112 7.5c1.92 0 3.674.72 4.99 1.9M10.22 10.22A3.736 3.736 0 0112 9.75c.966 0 1.845.363 2.507.956M12 18.75h.008v.008H12v-.008z" />
      </svg>
    </div>

    <!-- Status badge -->
    <div class="badge">
      <span class="dot"></span>
      No connection
    </div>

    <!-- Heading + body -->
    <h1>You're offline</h1>
    <p>It looks like your internet connection was lost. Check your network settings and try again — your data is safe.</p>

    <!-- Visual divider -->
    <div class="divider"></div>

    <!-- CTA -->
    <button class="btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Try again
    </button>

    <!-- Wordmark -->
    <div class="wordmark">
      <span class="wordmark-dot"></span>
      Authlog
      <span class="wordmark-dot"></span>
    </div>

  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
